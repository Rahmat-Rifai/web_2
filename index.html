<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Halaman Sederhana</title>
	<style>
		body {
			font-family: system-ui, sans-serif;
			display: grid;
			place-items: center;
			min-height: 100vh;
			margin: 0;
			background: #f4f4f4;
		}
		main {
			text-align: center;
			background: #fff;
			padding: 2rem 3rem;
			border-radius: 12px;
			box-shadow: 0 2px 10px rgba(0,0,0,.1);
		}
		button {
			padding: .5rem 1.25rem;
			border: none;
			border-radius: 6px;
			background: #2563eb;
			color: #fff;
			cursor: pointer;
		}
	</style>
</head>
<body>
	<main>
		<h1>Halo, Dunia!</h1>
		<p>Ini halaman HTML sederhana.</p>
		<button onclick="alert('Tombol diklik!')">Klik Saya</button>
	</main>
</body>
</html>
